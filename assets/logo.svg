<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <g transform="translate(100, 45)">
    <!-- Spiral radar logo -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#008080" stroke-width="4.5" stroke-dasharray="140, 20"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#008080" stroke-width="4.5" stroke-dasharray="100, 20"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#008080" stroke-width="4.5"/>
    <circle cx="0" cy="0" r="7" fill="#d9534f"/>
    <!-- Red target pointer arrow -->
    <polygon points="0,-42 7,-24 -7,-24" fill="#d9534f"/>
  </g>
  <!-- MJC bold typography -->
  <g transform="translate(100, 95)" text-anchor="middle">
    <rect x="-65" y="-14" width="130" height="4" fill="#f0ad4e" rx="1"/>
    <text x="0" y="16" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="28" fill="#008080" letter-spacing="4">MJC</text>
  </g>
</svg>
